name: Build GoConsoleOS Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APKs
        run: |
          gradle :apps:portable:assembleDebug :apps:touchscreen:assembleDebug :apps:account:assembleDebug :apps:goai:assembleDebug --no-daemon --no-watch-fs

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: GoConsoleOS-APKs
          path: |
            apps/portable/build/outputs/apk/debug/*.apk
            apps/touchscreen/build/outputs/apk/debug/*.apk
            apps/account/build/outputs/apk/debug/*.apk
            apps/goai/build/outputs/apk/debug/*.apk
          if-no-files-found: error